[tool.poetry]
name = "clusterapp-backend"
version = "0.1.0"
description = "FastAPI backend for Walmart sales forecasting (SARIMAX) and clustering"
authors = ["clusterapp-team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
pandas = "^2.0"
numpy = "^1.24"
scipy = "^1.11"
statsmodels = "^0.14"
matplotlib = "^3.8"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
