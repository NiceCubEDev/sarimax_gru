[project]
name = "clusterapp-backend"
version = "0.1.0"
description = "FastAPI backend for Walmart sales forecasting (SARIMAX) and clustering"
authors = [{name = "clusterapp-team"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "python-multipart>=0.0.20",
    "torch>=2.0",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.11",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

# Настройки для форматирования
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

# Включаем автоматические исправления для ruff
[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "RET"]
extend-select = [
    "RUF100",
    "PLR1702",
    "C4",
]
ignore = [
    "E266",
    "RET504",
    "RET505",
    "RET507",
    "RET508",
    "UP035",
    "UP034",
    "UP037",
    "UP041",
    "B008",
]

fixable = ["ALL"]  # Автоматически исправлять ошибки, где это возможно
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["worker"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-nested-blocks = 4
